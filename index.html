<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Chat with Wazungu</title>
<style>
body { background:#111; color:#fff; font-family:Arial; text-align:center; padding:20px; }
.card { background:#222; padding:20px; border-radius:10px; max-width:400px; margin:auto; }
input { width:90%; padding:12px; margin:10px 0; border-radius:5px; border:none; font-size:16px; }
.btn { background:#00C853; color:#fff; padding:15px; border:none; border-radius:8px; width:100%; font-size:18px; cursor:pointer; margin-top:10px; text-decoration:none; display:block; }
.btn:active { background:#009624; }
.btn-wa { background:#25D366; } /* WhatsApp Green */
.btn-wa:active { background:#128C7E; }
p { font-size:14px; color:#ccc; }
</style>
</head>
<body>
<div class="card">
<h2>Register to Chat with Wazungu</h2>
<p>Registration Fee: Ksh 60</p>

<form onsubmit="return sendPayment()">
<input type="text" id="name" placeholder="Enter Your Full Name" required>
<input type="tel" id="phone" placeholder="Enter M-PESA Number e.g 07xxxxxxxx" required>
<button class="btn" type="submit">Register Ksh 60</button>
</form>

<div id="message" style="display:none; margin-top:15px;">
<p style="color:#00C853;"><b>Step 1:</b> We received your details<br>
<b>Step 2:</b> Tap below to pay Ksh 60</p>

<a id="payLink" class="btn" href="#">Pay Now with M-PESA</a>

<p style="margin-top:15px; color:#ccc;">After paying, chat with us:</p>
<a class="btn btn-wa" href="https://wa.me/254702486287?text=Hi%20I%20have%20paid%20Ksh60%20for%20registration" target="_blank">Chat on WhatsApp</a>

</div>

</div>

<script>
function sendPayment() {
let name = document.getElementById("name").value;
let phone = document.getElementById("phone").value;
let amount = 60;
let paybill = "0702486287"; // Your number

// USSD link with amount pre-filled
let ussd = `tel:*334*1*1*${paybill}*${amount}%23`;
document.getElementById("payLink").href = ussd;

// Update WhatsApp link with their name
let waLink = `https://wa.me/254702486287?text=Hi%20I%20am%20${encodeURIComponent(name)}.%20I%20have%20paid%20Ksh60%20for%20registration`;
document.querySelector(".btn-wa").href = waLink;

document.getElementById("message").style.display = "block";
alert("Thanks " + name + "! Now tap 'Pay Now' to complete payment");
return false; 
}
</script>
</body>
</html>
